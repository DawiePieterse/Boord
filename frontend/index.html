<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Boord</title>
<!-- The root page has no manifest or icons of its own: it is the setup page
     that sends a device on to its screen, and it borrows Field's manifest
     because a field tablet is what is usually being set up here. The tags
     below make "Add to Home Screen" on an iPhone match the installed apps -
     brand-blue bar, the Boord icon, a short name - instead of a screenshot
     icon labelled with the server's address. -->
<link rel="manifest" href="field/manifest.json">
<link rel="icon" href="field/icons/icon-192.png">
<link rel="apple-touch-icon" href="field/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boord">
<meta name="theme-color" content="#0A2F6B">
<script>
// One release per page load. The service worker takes over open pages as soon
// as a new release installs (skipWaiting + clients.claim), so a page that was
// still loading can end up with index.html from the old offline copy and the
// files fetched after the takeover from the new release - a mix that can leave
// a screen blank (Boord's white Admin screen, Packhouse's empty Setup page).
// Reload once, so every file comes from the same release. Inline and first, so
// the listener is in place before any other file loads.
if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
  navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
}
</script>
<script src="shared/tailwind.js"></script>
<link rel="stylesheet" href="shared/styles.css">
<script src="shared/api.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div id="setup" class="bg-white rounded-2xl shadow p-6 w-full max-w-sm">
  <div class="text-center mb-6">
    <div class="text-2xl font-bold" style="color: var(--boord-blue)">Boord</div>
    <div class="text-sm text-slate-500">Device Setup</div>
  </div>
  <label class="block text-sm font-medium text-slate-700 mb-1">This device's ID</label>
  <select id="deviceIdSelect" class="w-full border border-slate-300 rounded-lg p-3 mb-2 text-lg hidden"></select>
  <input id="deviceIdInput" placeholder="e.g. device-01"
         class="w-full border border-slate-300 rounded-lg p-3 mb-2 text-lg hidden">
  <div id="deviceListStatus" class="text-xs text-slate-400 mb-2">Loading the device list...</div>
  <div class="text-xs text-slate-400 mb-4">Ask the admin which ID belongs to this device. This is only needed once - the device remembers it after that.</div>
  <button id="continueBtn" class="w-full boord-btn-primary rounded-lg py-3 font-semibold">Continue</button>
  <div id="setupError" class="text-red-600 text-sm mt-3 hidden"></div>
</div>

<!-- Shown instead of an automatic redirect for a device whose role is Admin.
     That is the owner's own phone or laptop, and it is also where Field and
     Packhouse need to be opened from. Field and Packhouse devices never see
     this: they go straight to their screen, because a picker in the orchard
     is a tap nobody wants and one more thing that needs the server. -->
<div id="rolePicker" class="bg-white rounded-2xl shadow p-6 w-full max-w-sm hidden">
  <div class="text-center mb-6">
    <div class="text-2xl font-bold" style="color: var(--boord-blue)">Boord</div>
    <div class="text-sm text-slate-500">Open as</div>
  </div>
  <button data-role="admin" class="role-btn w-full boord-btn-primary rounded-lg py-3 font-semibold mb-3">Admin</button>
  <button data-role="field" class="role-btn w-full border border-slate-300 rounded-lg py-3 font-semibold mb-3">Field</button>
  <button data-role="packhouse" class="role-btn w-full border border-slate-300 rounded-lg py-3 font-semibold">Packhouse</button>
</div>

<script>
function destinationFor(config) {
  return {
    field: "field/",
    packhouse: "packhouse/",
    admin: "admin/",
  }[config.role] || "admin/";
}

// Only an Admin device chooses. destinationFor() sends any role it does not
// know to admin/, so "not field and not packhouse" is exactly the set of
// devices that land on Admin today.
function needsPicker(config) {
  return config.role !== "field" && config.role !== "packhouse";
}

function showRolePicker() {
  document.getElementById("setup").classList.add("hidden");
  const picker = document.getElementById("rolePicker");
  picker.classList.remove("hidden");
  picker.querySelectorAll(".role-btn").forEach((btn) => {
    btn.onclick = () => { location.href = destinationFor({ role: btn.dataset.role }); };
  });
}

function openFor(config) {
  if (needsPicker(config)) showRolePicker();
  else location.href = destinationFor(config);
}

async function routeDevice(deviceId) {
  const config = await Boord.fetchDeviceConfig(deviceId);
  Boord.setDeviceId(deviceId);
  openFor(config);
}

// The list comes from the server so a device added in Settings -> Master Data can be
// picked straight away. If the list can't be fetched the screen falls back to
// typing the id by hand, which is all setup ever really needs.
async function loadDeviceOptions() {
  const select = document.getElementById("deviceIdSelect");
  const input = document.getElementById("deviceIdInput");
  const status = document.getElementById("deviceListStatus");
  try {
    const devices = await Boord.api("/api/devices/setup-options");
    if (!devices.length) throw new Error("no devices configured");
    select.innerHTML = devices.map((d) => {
      const label = d.station ? `${d.id} - ${d.station}` : d.id;
      return `<option value="${Boord.escapeHtml(d.id)}">${Boord.escapeHtml(label)}</option>`;
    }).join("");
    select.classList.remove("hidden");
    status.classList.add("hidden");
  } catch (e) {
    input.classList.remove("hidden");
    status.textContent = Boord.isNetworkError(e)
      ? "Can't reach the server - type this device's ID to continue."
      : "No device list available - type this device's ID to continue.";
  }
}

function chosenDeviceId() {
  const select = document.getElementById("deviceIdSelect");
  if (!select.classList.contains("hidden")) return select.value;
  return document.getElementById("deviceIdInput").value.trim();
}

(async function init() {
  const existing = Boord.getDeviceId();
  if (existing) {
    try {
      await routeDevice(existing);
      return;
    } catch (e) {
      // Only a server that answered "unknown" invalidates the saved id - an
      // unreachable one must not wipe a device's setup and strand it.
      if (!Boord.isNetworkError(e)) Boord.clearDeviceId();
      else {
        // Server unreachable. A device that has been set up before already
        // knows its role, so send it straight to its screen - that screen is
        // cached and works offline. Dropping through to the setup form here
        // would strand a picker at a "type your device ID" prompt in the
        // middle of the orchard, with no way to reach the capture screen.
        const cached = Boord.getCachedDeviceConfig(existing);
        if (cached) { openFor(cached); return; }
      }
    }
  }
  await loadDeviceOptions();
  document.getElementById("continueBtn").addEventListener("click", async () => {
    const id = chosenDeviceId();
    const errEl = document.getElementById("setupError");
    errEl.classList.add("hidden");
    if (!id) return;
    try {
      await routeDevice(id);
    } catch (e) {
      errEl.textContent = Boord.isNetworkError(e)
        ? "Can't reach the server - check the connection and try again."
        : "Unknown device id. Check with the admin, or add this device in Settings -> Master Data.";
      errEl.classList.remove("hidden");
    }
  });
})();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}
</script>
</body>
</html>
